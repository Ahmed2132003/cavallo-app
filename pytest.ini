[pytest]
# --ds (via addopts) is used instead of the plain DJANGO_SETTINGS_MODULE
# ini option deliberately: pytest-django's precedence is
# --ds > DJANGO_SETTINGS_MODULE env var > DJANGO_SETTINGS_MODULE ini
# option. docker-compose.yml (Part P-010) sets DJANGO_SETTINGS_MODULE as
# a real environment variable inside the container for manage.py's sake
# (config.settings.dev), which would otherwise silently outrank a plain
# ini setting here and make pytest run against dev's INSTALLED_APPS
# instead of test's. --ds is the one thing that outranks that env var.
addopts = --ds=config.settings.test
python_files = tests.py test_*.py *_tests.py