name: Backend CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # P-000's settings.py reads these via django-environ. Dummy values are
      # fine here — nothing points at real infrastructure in CI.
      SECRET_KEY: ci-only-insecure-secret-key
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://ci_user:ci_password@localhost:5432/ci_db
      REDIS_URL: redis://localhost:6379/0
      CORS_ALLOWED_ORIGINS: ""
      SENTRY_DSN: ""
      # Object storage for the tests (core/storage_backends.py reads these).
      # The tests really upload files (Story/Reel media), so they need a
      # real S3-compatible server: the "Start SeaweedFS" step below runs one on
      # localhost:9000 with these same credentials. The region must be
      # non-empty, otherwise boto3 builds the endpoint "https://s3..amazonaws.com"
      # and fails with "Invalid endpoint". OBJECT_STORAGE_PUBLIC_ENDPOINT_URL is
      # left unset on purpose: it falls back to the endpoint URL.
      OBJECT_STORAGE_BUCKET: scd-ci-media
      OBJECT_STORAGE_KEY: ci-minio-user
      OBJECT_STORAGE_SECRET: ci-minio-secret
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_ENDPOINT_URL: http://localhost:9000
      OBJECT_STORAGE_USE_SSL: "False"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (matches Dockerfile's python:3.12-slim)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Lint/test tooling isn't part of the app's runtime requirements.txt,
          # so it's installed here rather than added to it.
          pip install flake8 black pytest pytest-django

      - name: flake8
        run: flake8 .

      - name: black --check
        run: black --check .

      - name: Django system check
        run: python manage.py check

      # Same system packages the Dockerfile installs for the tests:
      # libmagic1 (python-magic, upload validation) and ffmpeg (real video
      # transcoding in content/tests/test_tasks.py). A no-op if the runner
      # image already has them.
      - name: Install system packages used by the tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libmagic1 ffmpeg

      # MinIO's official images/binaries are no longer downloadable (quay.io
      # and dl.min.io both refuse), so the tests use SeaweedFS's S3 gateway,
      # which is S3-compatible and needs no license. Credentials come from
      # the same OBJECT_STORAGE_* env vars as the app.
      - name: Start SeaweedFS (S3-compatible object storage)
        run: |
          cat > "$RUNNER_TEMP/s3.json" <<EOF
          {
            "identities": [
              {
                "name": "ci",
                "credentials": [
                  { "accessKey": "$OBJECT_STORAGE_KEY", "secretKey": "$OBJECT_STORAGE_SECRET" }
                ],
                "actions": ["Admin", "Read", "Write", "List", "Tagging"]
              }
            ]
          }
          EOF
          docker run -d --name seaweedfs \
            -p 9000:8333 \
            -v "$RUNNER_TEMP/s3.json":/etc/s3.json \
            chrislusf/seaweedfs:latest \
            server -s3 -s3.config=/etc/s3.json -dir=/data
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:9000/; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::SeaweedFS did not become ready"
          docker logs seaweedfs
          exit 1

      - name: Create object storage bucket
        run: |
          python - <<'PY'
          import os
          import boto3
          from botocore.config import Config

          s3 = boto3.client(
              "s3",
              endpoint_url=os.environ["OBJECT_STORAGE_ENDPOINT_URL"],
              aws_access_key_id=os.environ["OBJECT_STORAGE_KEY"],
              aws_secret_access_key=os.environ["OBJECT_STORAGE_SECRET"],
              region_name=os.environ["OBJECT_STORAGE_REGION"],
              config=Config(s3={"addressing_style": "path"}),
          )
          s3.create_bucket(Bucket=os.environ["OBJECT_STORAGE_BUCKET"])
          print("bucket ready")
          PY

      - name: pytest
        run: pytest

# ---------------------------------------------------------------------------
# Part P-103: deployment. Both jobs run only on a push (never on a pull
# request), only after lint-and-test succeeded, and only from the branch that
# maps to the environment:  develop -> staging,  main -> production.
#
# The deploy job targets a GitHub Environment. For "production" that
# Environment MUST have a required-reviewers protection rule (Settings ->
# Environments -> production). That rule is the manual approval gate required
# by architecture Section 23. The workflow file alone cannot enforce it.
# ---------------------------------------------------------------------------

  deploy-staging:
    name: Deploy to staging (automatic)
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    # Never two deploys of the same environment at once, and never cancel a
    # deploy that is already running (a half-finished migrate is worse than
    # waiting).
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      DEPLOY_ENV: staging
      DEPLOY_SHA: ${{ github.sha }}
      DEPLOY_HOST: ${{ secrets.STAGING_HOST }}
      DEPLOY_USER: ${{ secrets.STAGING_USER }}
      DEPLOY_PORT: ${{ secrets.STAGING_SSH_PORT || '22' }}
      DEPLOY_APP_DIR: ${{ secrets.STAGING_APP_DIR }}
      DEPLOY_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}

    steps:
      # Until the real VPS/domain details exist (architecture Section 7 items
      # 6 and 9) these secrets are empty. Fail early with a clear message
      # instead of a confusing ssh error.
      - name: Verify staging deploy secrets are configured
        run: |
          missing=0
          check() {
            if [ -z "$2" ]; then
              echo "::error::Missing staging deploy secret: $1"
              missing=1
            fi
          }
          check STAGING_HOST "$DEPLOY_HOST"
          check STAGING_USER "$DEPLOY_USER"
          check STAGING_APP_DIR "$DEPLOY_APP_DIR"
          check STAGING_SSH_KEY "$DEPLOY_SSH_KEY"
          check STAGING_SSH_KNOWN_HOSTS "$DEPLOY_KNOWN_HOSTS"
          exit "$missing"

      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # deploy.sh then runs: build -> db/redis up -> PRE-MIGRATION BACKUP
      # (pg_dump to object storage, backups/ prefix) -> migrate -> restart.
      # The checkout happens here, before deploy.sh starts, so bash never
      # reads a script file that git is replacing underneath it.
      - name: Deploy to staging (backup, then migrate, then restart)
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_APP_DIR' && git fetch --prune origin && git checkout --detach '$DEPLOY_SHA' && ./scripts/deploy/deploy.sh '$DEPLOY_ENV' '$DEPLOY_SHA'"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts

  deploy-production:
    name: Deploy to production (manual approval)
    # Pauses here until a required reviewer approves the "production" Environment.
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    # Never two deploys of the same environment at once, and never cancel a
    # deploy that is already running (a half-finished migrate is worse than
    # waiting).
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      DEPLOY_ENV: production
      DEPLOY_SHA: ${{ github.sha }}
      DEPLOY_HOST: ${{ secrets.PRODUCTION_HOST }}
      DEPLOY_USER: ${{ secrets.PRODUCTION_USER }}
      DEPLOY_PORT: ${{ secrets.PRODUCTION_SSH_PORT || '22' }}
      DEPLOY_APP_DIR: ${{ secrets.PRODUCTION_APP_DIR }}
      DEPLOY_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}

    steps:
      # Until the real VPS/domain details exist (architecture Section 7 items
      # 6 and 9) these secrets are empty. Fail early with a clear message
      # instead of a confusing ssh error.
      - name: Verify production deploy secrets are configured
        run: |
          missing=0
          check() {
            if [ -z "$2" ]; then
              echo "::error::Missing production deploy secret: $1"
              missing=1
            fi
          }
          check PRODUCTION_HOST "$DEPLOY_HOST"
          check PRODUCTION_USER "$DEPLOY_USER"
          check PRODUCTION_APP_DIR "$DEPLOY_APP_DIR"
          check PRODUCTION_SSH_KEY "$DEPLOY_SSH_KEY"
          check PRODUCTION_SSH_KNOWN_HOSTS "$DEPLOY_KNOWN_HOSTS"
          exit "$missing"

      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # deploy.sh then runs: build -> db/redis up -> PRE-MIGRATION BACKUP
      # (pg_dump to object storage, backups/ prefix) -> migrate -> restart.
      # The checkout happens here, before deploy.sh starts, so bash never
      # reads a script file that git is replacing underneath it.
      - name: Deploy to production (backup, then migrate, then restart)
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_APP_DIR' && git fetch --prune origin && git checkout --detach '$DEPLOY_SHA' && ./scripts/deploy/deploy.sh '$DEPLOY_ENV' '$DEPLOY_SHA'"

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts