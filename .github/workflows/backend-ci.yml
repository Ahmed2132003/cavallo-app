name: Backend CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # P-000's settings.py reads these via django-environ. Dummy values are
      # fine here — nothing points at real infrastructure in CI.
      SECRET_KEY: ci-only-insecure-secret-key
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://ci_user:ci_password@localhost:5432/ci_db
      REDIS_URL: redis://localhost:6379/0
      CORS_ALLOWED_ORIGINS: ""
      SENTRY_DSN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (matches Dockerfile's python:3.12-slim)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Lint/test tooling isn't part of the app's runtime requirements.txt,
          # so it's installed here rather than added to it.
          pip install flake8 black pytest

      - name: flake8
        run: flake8 .

      - name: black --check
        run: black --check .

      - name: Django system check
        run: python manage.py check

      - name: pytest
        run: |
          # No test suite exists yet (Phase 0). Exit code 5 = "no tests
          # collected", which pytest treats as failure by default but is
          # expected and fine at this stage — everything else still fails
          # the job normally.
          pytest || [ "$?" -eq 5 ]