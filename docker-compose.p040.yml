# TEMPORARY, UNCOMMITTED override for the Part P-040 manual verification.
# Points ONLY the web service at config/settings/manual_p040.py (dev.py +
# the DummyContent test model). Used with:
#   docker compose -f docker-compose.yml -f docker-compose.p040.yml up -d web
# Not named docker-compose.override.yml on purpose, so Compose never loads
# it automatically.
services:
  web:
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.manual_p040