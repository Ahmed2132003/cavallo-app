# Part P-103 baseline, extended in place by Part P-106 (production deployment
# configuration). Used by scripts/deploy/deploy.sh. Do not create a second
# production compose file.
#
# STATUS: complete and correct configuration; NOT yet run on a real VPS.
# Genuine deployment is pending Section 7 items 6 (VPS specifics) and 9
# (domain). Only VALUES are missing (domain, e-mail, sizes), not configuration.
#
# Topology (P-106):
#   internet -> nginx (TLS, 80/443) -+-> web  : Gunicorn (WSGI), HTTP/REST/admin
#                                    +-> asgi : Daphne, WebSocket /ws/ (chat, P-067)
#   celery_worker, celery_beat, db (postgres:16), redis (redis:7)
#   certbot renews the Let's Encrypt certificate; nginx reloads every 6 hours.
# web and asgi publish NO host ports (expose only): they are reachable only
# through nginx. config.settings.prod trusts X-Forwarded-Proto
# (SECURE_PROXY_SSL_HEADER), which is only safe because of that.
#
# Differences from docker-compose.staging.yml, on purpose:
#   - nginx + certbot in front, web (Gunicorn) and asgi (Daphne) are separate
#   - DJANGO_SETTINGS_MODULE=config.settings.prod (SECURE_SSL_REDIRECT, secure
#     cookies, secure proxy header)
#   - larger limits than staging (still bounded, still placeholders)
#   - celery worker concurrency and Redis maxmemory are decided here (see below)
#
# RESOURCE LIMITS: every container has deploy.resources.limits (cpus, memory)
# plus memswap_limit equal to memory (no swap spill; Docker kills at the
# limit). Production must never ship unlimited containers (Section 22: this
# project shares the VPS with Eduvia / Managora / Shark / 2ROOTS).
# ALL numbers are conservative PLACEHOLDERS until Section 7 item 6 is known.
# Worst case if every container hit its limit: 5.35 CPU / 4992 MB.
#
# Decisions made here (owner may change; use the env vars, no file edit needed):
#   - Celery worker concurrency: 2 (CELERY_CONCURRENCY). Without it Celery
#     starts one process per host core.
#   - Gunicorn workers: 2 (GUNICORN_WORKERS). Re-tune once real VPS CPU/RAM is
#     known: roughly 2 x cores + 1 only if memory allows (about 150 MB each).
#   - Redis: maxmemory 256mb, policy volatile-lru (REDIS_MAXMEMORY,
#     REDIS_MAXMEMORY_POLICY). One Redis serves Celery broker, cache and
#     Channels. volatile-lru only evicts keys that have a TTL (cache entries,
#     expiring results), never the Celery queue. Redis has no persistence: a
#     restart still loses queued tasks.
#
# Required in the .env next to this file on the VPS (never in git):
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, SECRET_KEY, ALLOWED_HOSTS,
#   CORS_ALLOWED_ORIGINS, DATABASE_URL (host "db"), REDIS_URL (host "redis"),
#   OBJECT_STORAGE_* (including OBJECT_STORAGE_ENDPOINT_URL if not AWS S3),
#   DOMAIN and LETSENCRYPT_EMAIL (certificate issuance/renewal).
# Optional: HTTP_PORT (80), HTTPS_PORT (443) if the VPS already uses them,
#   GUNICORN_WORKERS, CELERY_CONCURRENCY, REDIS_MAXMEMORY,
#   REDIS_MAXMEMORY_POLICY.
#
# FIRST CERTIFICATE (one time, before the first full start; host port 80 must
# be free; replace DOMAIN and EMAIL):
#   docker compose -f docker-compose.prod.yml run --rm --no-deps -p 80:80 \
#     --entrypoint certbot certbot certonly --standalone --cert-name cavallo \
#     -d DOMAIN -m EMAIL --agree-tos --non-interactive
# After that the certbot service keeps the certificate renewed over webroot.
#
# LOCAL DRY-RUN ONLY (no domain, no TLS): set NGINX_CONF=./nginx/local.conf
# and HTTP_PORT=8080 in the environment. Never do this on the VPS.

x-app: &app
  build: .
  restart: unless-stopped
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Conservative placeholder pending real sibling-project usage data (Section 7 item 6) - revisit once known.
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1536M
    memswap_limit: 1536M

  redis:
    image: redis:7
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - ${REDIS_MAXMEMORY_POLICY:-volatile-lru}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Conservative placeholder pending real sibling-project usage data (Section 7 item 6) - revisit once known.
    # maxmemory (256mb) stays below this limit so Redis refuses/evicts before Docker OOM-kills it.
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384M
    memswap_limit: 384M

  web:
    <<: *app
    # Gunicorn (WSGI) for all HTTP traffic. collectstatic fills the shared
    # static volume that nginx serves at /static/.
    command:
      - sh
      - -c
      - >-
        python manage.py collectstatic --noinput &&
        exec gunicorn config.wsgi:application
        --bind 0.0.0.0:8000
        --workers ${GUNICORN_WORKERS:-2}
        --timeout 60
        --graceful-timeout 30
        --worker-tmp-dir /dev/shm
        --access-logfile -
        --error-logfile -
    expose:
      - "8000"
    volumes:
      - static_data:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    # Conservative placeholder pending real sibling-project usage data (Section 7 item 6) - revisit once known.
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 768M
    memswap_limit: 768M

  asgi:
    <<: *app
    # Daphne serves the Channels application (chat WebSocket, P-067). Nginx
    # routes only /ws/ here; everything else goes to web.
    command: daphne -b 0.0.0.0 -p 8001 config.asgi:application
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8001), 2).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Conservative placeholder pending real sibling-project usage data (Section 7 item 6) - revisit once known.
    # Memory grows with open WebSocket connections.
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 640M
    memswap_limit: 640M

  celery_worker:
    <<: *app
    command: celery -A config worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-2}
    # Conservative placeholder pending real sibling-project usage data (Section 7 item 6) - revisit once known.
    # Reel transcoding (ffmpeg, up to 100 MB uploads) is the heavy path; not yet tested under this limit (L-5).
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1G
    memswap_limit: 1G

  celery_beat:
    <<: *app
    command: celery -A config beat --loglevel=info --schedule /var/lib/celerybeat/celerybeat-schedule
    volumes:
      - celerybeat_data:/var/lib/celerybeat
    # Conservative placeholder pending real sibling-project usage data (Section 7 item 6) - revisit once known.
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 384M
    memswap_limit: 384M

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      asgi:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ${NGINX_CONF:-./nginx/prod.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - static_data:/var/www/static:ro
      - certbot_www:/var/www/certbot:ro
      - letsencrypt:/etc/letsencrypt:ro
    # Reload every 6 hours so a renewed certificate is picked up.
    command:
      - sh
      - -c
      - while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g 'daemon off;'
    # Conservative placeholder pending real sibling-project usage data (Section 7 item 6) - revisit once known.
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    memswap_limit: 128M

  certbot:
    image: certbot/certbot:v3.0.1
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
    volumes:
      - certbot_www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    # Idempotent: issues if missing, renews when close to expiry, otherwise
    # does nothing. Disabled (logs a notice) while DOMAIN / LETSENCRYPT_EMAIL
    # are empty, e.g. in the local dry-run.
    entrypoint:
      - sh
      - -c
      - >-
        trap exit TERM;
        while :; do
        if [ -n "$${DOMAIN}" ] && [ -n "$${LETSENCRYPT_EMAIL}" ]; then
        certbot certonly --webroot -w /var/www/certbot --cert-name cavallo
        -d "$${DOMAIN}" -m "$${LETSENCRYPT_EMAIL}" --agree-tos --non-interactive
        --keep-until-expiring;
        else echo "certbot: DOMAIN or LETSENCRYPT_EMAIL not set, renewal disabled";
        fi;
        sleep 12h & wait $${!};
        done
    # Conservative placeholder pending real sibling-project usage data (Section 7 item 6) - revisit once known.
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: 128M
    memswap_limit: 128M

volumes:
  postgres_data:
  celerybeat_data:
  static_data:
  certbot_www:
  letsencrypt:
