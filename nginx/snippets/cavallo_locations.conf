# Part P-106 - shared location blocks for the Cavallo reverse proxy.
#
# Included INSIDE a server block by BOTH nginx/prod.conf (TLS) and
# nginx/local.conf (the non-TLS local dry-run stand-in), so the local dry-run
# exercises the exact same routing and WebSocket-upgrade configuration that
# production uses. Do not copy these blocks into either file.
#
# Expects the including server block to provide:
#   - upstreams cavallo_web (Gunicorn, HTTP) and cavallo_asgi (Daphne, WebSocket)
#   - $forwarded_proto (https in production; forced to https in local.conf so
#     Django's SECURE_SSL_REDIRECT does not redirect the local dry-run forever)

# Reel upload limit is 100 MB (content/serializers.py) plus multipart overhead.
client_max_body_size 105m;
client_body_timeout 120s;

# collectstatic output (Django admin assets) shared with the web container.
location /static/ {
    alias /var/www/static/;
    expires 7d;
    access_log off;
}

# WebSocket traffic (chat, P-067: /ws/conversations/<id>/) -> Daphne.
# Upgrade + Connection are what make the handshake work. Without them plain
# HTTP still works but every WebSocket connection fails to upgrade.
location /ws/ {
    proxy_pass http://cavallo_asgi;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# Everything else (REST API, admin, /health/) -> Gunicorn.
location / {
    proxy_pass http://cavallo_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 60s;
}
