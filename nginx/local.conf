# Part P-106 - LOCAL DRY-RUN ONLY. Never deploy this file.
#
# Non-TLS stand-in for nginx/prod.conf so the production stack can be tested
# on a developer machine without a domain or certificates. It uses the very
# same routing as production (nginx/snippets/cavallo_locations.conf).
#
# The only deliberate difference: $forwarded_proto is forced to "https".
# config.settings.prod has SECURE_SSL_REDIRECT=True, so without that header
# Django would answer every plain-HTTP local request with a 301 to HTTPS.

server {
    listen 80;
    server_name _;
    server_tokens off;

    set $forwarded_proto https;

    include /etc/nginx/snippets/cavallo_locations.conf;
}
