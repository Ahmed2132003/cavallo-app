# Part P-106 - production Nginx: TLS termination + reverse proxy.
#
# Mounted as /etc/nginx/conf.d/default.conf by docker-compose.prod.yml.
# Routing lives in nginx/snippets/cavallo_locations.conf (shared with
# nginx/local.conf).
#
#   /ws/*  -> asgi (Daphne)   with Upgrade/Connection headers
#   others -> web  (Gunicorn)
#
# server_name is a catch-all on purpose: the real domain (Section 7 item 9)
# is enforced by Django's ALLOWED_HOSTS and by the certificate, so no domain
# is baked into this file. Certificate path is fixed (--cert-name cavallo).
# Certbot issues it with: certbot certonly --cert-name cavallo -d <domain>

upstream cavallo_web {
    server web:8000;
}

upstream cavallo_asgi {
    server asgi:8001;
}

# Port 80: ACME challenge for Let's Encrypt, everything else -> HTTPS.
server {
    listen 80;
    server_name _;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Port 443: TLS terminates here; Django sees plain HTTP plus
# X-Forwarded-Proto: https (see SECURE_PROXY_SSL_HEADER in config/settings/prod.py).
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/cavallo/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cavallo/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    set $forwarded_proto $scheme;

    include /etc/nginx/snippets/cavallo_locations.conf;
}
